name: ci

on: push

# I pacchetti @fullbrains stanno su GitHub Packages (privati): li legge il token del workflow,
# a cui ogni pacchetto dà accesso nelle sue impostazioni («Manage Actions access»).
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Nel .npmrc dell'utente: pnpm non accetta credenziali nel .npmrc del repository.
      - name: Registry dei pacchetti @fullbrains
        run: |
          echo "@fullbrains:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
